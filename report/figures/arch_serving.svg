<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#1c1a17" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fffdf7; stroke: #1c1a17; stroke-width: 1.1; }
    .accent { stroke: #8e2f22; stroke-width: 1.5; }
    .t { font-size: 13px; fill: #1c1a17; font-weight: bold; text-anchor: middle; }
    .s { font-size: 10.5px; fill: #6b6156; text-anchor: middle; }
    .flow { stroke: #1c1a17; fill: none; stroke-width: 1.1; }
  </style>

  <rect class="box" x="25" y="60" width="160" height="80" rx="6"/>
  <text class="t" x="105" y="90">Run assessment</text>
  <text class="s" x="105" y="108">form submits atomically</text>
  <text class="s" x="105" y="123">(disease, patient values)</text>

  <rect class="box accent" x="240" y="60" width="200" height="80" rx="6"/>
  <text class="t" x="340" y="86">Cache lookup</text>
  <text class="s" x="340" y="104">key = (disease, values)</text>
  <text class="s" x="340" y="120">st.cache_data, 64 entries</text>

  <rect class="box" x="495" y="20" width="180" height="66" rx="6"/>
  <text class="t" x="585" y="46">Hit: reuse result</text>
  <text class="s" x="585" y="64">~0 ms — reruns, tab switches</text>

  <rect class="box" x="495" y="120" width="180" height="80" rx="6"/>
  <text class="t" x="585" y="146">Miss: score once</text>
  <text class="s" x="585" y="164">lazy-load disease model</text>
  <text class="s" x="585" y="179">one 200-model pass</text>

  <rect class="box" x="730" y="60" width="150" height="90" rx="6"/>
  <text class="t" x="805" y="92">All 5 report</text>
  <text class="t" x="805" y="110">sections</text>
  <text class="s" x="805" y="130">read the same result</text>

  <path class="flow" d="M185 100 H234" marker-end="url(#a4)"/>
  <path class="flow" d="M440 85 C 460 78, 465 58, 489 52" marker-end="url(#a4)"/>
  <path class="flow" d="M440 115 C 460 125, 465 145, 489 152" marker-end="url(#a4)"/>
  <path class="flow" d="M675 52 C 700 58, 700 80, 724 88" marker-end="url(#a4)"/>
  <path class="flow" d="M675 160 C 700 155, 700 130, 724 122" marker-end="url(#a4)"/>

  <text x="450" y="250" font-size="12" fill="#1c1a17" text-anchor="middle" font-style="italic">Each patient is scored exactly once; the interface only ever re-reads the memoized result.</text>
  <text x="450" y="270" font-size="12" fill="#1c1a17" text-anchor="middle" font-style="italic">Measured on the live deployment: 22 s per interaction before → 2–4 s after.</text>
</svg>
